name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archiv fürs iPhone bauen (ohne Signatur)
        run: |
          xcodebuild archive \
            -project TrackMySteps.xcodeproj -scheme TrackMySteps \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TrackMySteps.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
