name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: App bauen (Simulator, ohne Signatur)
        run: |
          xcodebuild -project TrackMySteps.xcodeproj -target TrackMySteps \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
