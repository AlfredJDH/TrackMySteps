name: TrackMySteps
options:
  bundleIdPrefix: de.familie
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  TrackMySteps:
    type: application
    platform: iOS
    sources:
      - TrackMySteps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.familie.trackmysteps
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Spaziergang
    info:
      path: TrackMySteps/Info.plist
      properties:
        CFBundleDisplayName: Spaziergang
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSMotionUsageDescription: "Damit die App Deine Schritte beim Spaziergang zählen kann."
        NSLocationWhenInUseUsageDescription: "Damit die App Deinen Weg auf der Karte aufzeichnen kann – auch wenn das Handy in der Tasche ist."
