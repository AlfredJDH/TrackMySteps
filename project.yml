name: TrackMySteps
options:
  bundleIdPrefix: io.github.alfredjdh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  TrackMySteps:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - TrackMySteps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alfredjdh.trackmysteps
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Spaziergang
    info:
      path: TrackMySteps/Info.plist
      properties:
        CFBundleDisplayName: Spaziergang
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSMotionUsageDescription: "Damit die App Deine Schritte beim Spaziergang zählen kann."
        NSLocationWhenInUseUsageDescription: "Damit die App Deinen Weg auf der Karte aufzeichnen kann – auch wenn das Handy in der Tasche ist."
